<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You, 🧬🎀🫶</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #e0fff9, #d3f0ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .card {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 30px 40px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 600px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card h1 {
    color: #1a4736;
    margin-bottom: 10px;
  }
  .card p {
    color: #2f5f4d;
    font-size: 16px;
    line-height: 1.5;
  }
  .card .heart {
    font-size: 50px;
    color: #ff6b92;
    margin: 20px 0;
    animation: beat 1s infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  .flower {
    width: 20px;
    height: 20px;
    background: #ffd1e6;
    border-radius: 50%;
    position: absolute;
    animation: float 5s infinite;
    opacity: 0.8;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0);}
    50% { transform: translateY(-30px) translateX(20px);}
    100% { transform: translateY(0) translateX(0);}
  }
</style>
</head>
<body>
<div class="card">
  <h1>Thank you, </h1>
  <div class="heart">❤️</div>
  <p>Thank you for guiding me patiently even when you're busy and making learning so much fun. Your encouragement means the world!</p>
</div>

<!-- floating flowers -->
<div class="flower" style="top:10%; left:5%; animation-delay: 0s;"></div>
<div class="flower" style="top:20%; left:90%; animation-delay: 1s;"></div>
<div class="flower" style="top:70%; left:15%; animation-delay: 2s;"></div>
<div class="flower" style="top:60%; left:80%; animation-delay: 3s;"></div>
<div class="flower" style="top:40%; left:50%; animation-delay: 4s;"></div>
</body>
</html>
